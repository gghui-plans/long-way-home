<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/><stop offset=".38" stop-color="#3a1763"/><stop offset=".62" stop-color="#a02a78"/><stop offset=".66" stop-color="#ff5a8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff07a"/><stop offset=".45" stop-color="#ffa24a"/><stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f4a"/><stop offset="1" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2456"/><stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5468"/><stop offset=".5" stop-color="#e2283f"/><stop offset="1" stop-color="#9c1428"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9c2d6"/><stop offset="1" stop-color="#8a8098"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="236" width="512" height="5" fill="#000"/>
      <rect x="0" y="256" width="512" height="7" fill="#000"/>
      <rect x="0" y="277" width="512" height="9" fill="#000"/>
      <rect x="0" y="299" width="512" height="11" fill="#000"/>
      <rect x="0" y="320" width="512" height="13" fill="#000"/>
    </mask>
    <clipPath id="above"><rect width="512" height="336"/></clipPath>
    <clipPath id="below"><rect y="336" width="512" height="176"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#ffe9f6">
    <circle cx="70" cy="62" r="2.2"/><circle cx="140" cy="118" r="1.6"/><circle cx="420" cy="54" r="2.4"/><circle cx="462" cy="140" r="1.6"/>
    <circle cx="300" cy="40" r="1.4"/><circle cx="210" cy="70" r="1.8"/><circle cx="372" cy="104" r="1.5"/><circle cx="40" cy="170" r="1.4"/>
  </g>

  <g class="fg">
  <!-- the striped sun, with a soft halo -->
  <circle cx="256" cy="300" r="170" fill="#ff6aa0" opacity=".35" filter="url(#soft)" clip-path="url(#above)"/>
  <g clip-path="url(#above)"><circle cx="256" cy="300" r="148" fill="url(#sun)" mask="url(#stripes)"/></g>

  <!-- palms -->
  <g fill="none" stroke="#12072a" stroke-linecap="round">
    <path d="M78 336 Q66 250 92 176" stroke-width="9"/>
    <path d="M92 176 q-40 -14 -66 10 M92 176 q-14 -36 -50 -38 M92 176 q14 -38 52 -32 M92 176 q42 -4 60 26 M92 176 q-30 10 -44 46 M92 176 q22 12 26 46" stroke-width="8"/>
    <path d="M444 336 Q452 270 432 214" stroke-width="8"/>
    <path d="M432 214 q34 -16 60 4 M432 214 q10 -32 42 -36 M432 214 q-14 -32 -48 -26 M432 214 q-36 0 -52 26 M432 214 q26 10 36 40" stroke-width="7"/>
  </g>

  </g>

  <!-- neon grid -->
  <rect y="336" width="512" height="176" fill="url(#ground)"/>
  <g clip-path="url(#below)" stroke="#ff3dbd" fill="none">
    <g stroke-width="3" filter="url(#glow)" opacity=".9">
      <path d="M0 344H512M0 356H512M0 374H512M0 400H512M0 438H512M0 492H512"/>
      <path d="M256 336L-344 512M256 336L-144 512M256 336L56 512M256 336L456 512M256 336L656 512M256 336L856 512"/>
    </g>
    <g stroke-width="2">
      <path d="M0 344H512M0 356H512M0 374H512M0 400H512M0 438H512M0 492H512"/>
      <path d="M256 336L-344 512M256 336L-144 512M256 336L56 512M256 336L456 512M256 336L656 512M256 336L856 512"/>
    </g>
  </g>
  <rect y="333" width="512" height="5" fill="#ff8ac0"/>

  <!-- the road -->
  <path d="M248 336H264L404 512H108Z" fill="url(#road)"/>
  <path d="M248 336L108 512M264 336L404 512" stroke="#4ff0ff" stroke-width="3"/>
  <path d="M254 346H258L259.5 360H252.5Z M251 374H261L263 398H249Z" fill="#ffd27a"/>

  <g class="fg">
  <!-- the convertible, from behind -->
  <ellipse cx="256" cy="494" rx="118" ry="12" fill="#07030f" opacity=".7"/>
  <rect x="164" y="472" width="38" height="26" rx="6" fill="#120a1c"/>
  <rect x="310" y="472" width="38" height="26" rx="6" fill="#120a1c"/>
  <path d="M188 404 Q190 386 212 384 L300 384 Q322 386 324 404 Z" fill="#7a1022"/>
  <rect x="214" y="364" width="30" height="30" rx="10" fill="#f1e2c6"/>
  <rect x="272" y="366" width="28" height="28" rx="10" fill="#f1e2c6"/>
  <circle cx="230" cy="358" r="17" fill="#2a1a14"/>
  <path d="M212 356 a18 18 0 0 1 36 0 Z" fill="#3b2418"/>
  <path d="M158 432 Q160 404 192 400 L320 400 Q352 404 354 432 L356 470 Q356 482 342 482 L170 482 Q156 482 156 470 Z" fill="url(#paint)"/>
  <path d="M176 404 L336 404" stroke="#ff8a96" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <g>
    <circle cx="186" cy="440" r="15" fill="#ff2a3a" filter="url(#glow)" opacity=".9"/>
    <circle cx="326" cy="440" r="15" fill="#ff2a3a" filter="url(#glow)" opacity=".9"/>
    <circle cx="186" cy="440" r="10" fill="#ff4a4a" stroke="url(#chrome)" stroke-width="3"/>
    <circle cx="326" cy="440" r="10" fill="#ff4a4a" stroke="url(#chrome)" stroke-width="3"/>
    <circle cx="212" cy="440" r="7" fill="#ff4a4a" stroke="url(#chrome)" stroke-width="2.5"/>
    <circle cx="300" cy="440" r="7" fill="#ff4a4a" stroke="url(#chrome)" stroke-width="2.5"/>
  </g>
  <rect x="236" y="446" width="40" height="20" rx="3" fill="#f6efe0"/>
  <rect x="242" y="453" width="28" height="5" rx="1" fill="#2b1b4a"/>
  <rect x="150" y="474" width="212" height="10" rx="5" fill="url(#chrome)"/>
  </g>
</svg>
